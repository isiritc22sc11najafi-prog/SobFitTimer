      - name: Add logo and V9 launcher icon
        run: |
          cp IMG_20260908_005331.jpg app/src/main/res/drawable-nodpi/sabahfit_logo.jpg

          ffmpeg -y -i IMG_20260908_005331.jpg             -vf "scale=468:468:force_original_aspect_ratio=decrease,pad=512:512:(ow-iw)/2:(oh-ih)/2:color=0x071729"             -frames:v 1 app/src/main/res/drawable-nodpi/ic_launcher.png

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          if 'android:icon=' not in s:
              s = s.replace(
                  'android:label="SABAHFIT TIMER"',
                  'android:icon="@drawable/ic_launcher"\n'
                  '        android:roundIcon="@drawable/ic_launcher"\n'
                  '        android:label="SABAHFIT TIMER"'
              )
          else:
              import re
              s = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/ic_launcher"', s)
              s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/ic_launcher"', s)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Boost coach whistle for phone speakers
        run: |
          ffmpeg -y             -i "referee's-whistle (2).mp3"             -af "highpass=f=500,loudnorm=I=-9:TP=-0.5:LRA=3"             -ar 44100 -ac 2 -b:a 192k             app/src/main/res/raw/referee_whistle.mp3

      - name: Set V10 version
        run: |
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 140/' app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "14.0"/' app/build.gradle
          grep -E 'versionCode|versionName' app/build.gradle

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SABAHFIT-TIMER-v14-SPLIT-TIMED-WHISTLE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
