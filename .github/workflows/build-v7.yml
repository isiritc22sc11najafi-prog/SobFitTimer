name: Build SABAHFIT TIMER V7

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-v7.yml"
      - ".github/workflows/build-v5.yml"
      - "IMG_20260908_005331.jpg"
      - "referee's-whistle (2).mp3"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip

      - name: Recreate V5 project source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          text = Path('.github/workflows/build-v5.yml').read_text(encoding='utf-8')
          marker = "cat > project.b64 <<'EOF'"
          if marker not in text:
              raise SystemExit('Embedded V5 project was not found.')

          block = text.split(marker, 1)[1]
          block = block.split("\n          EOF", 1)[0]
          payload = ''.join(line.strip() for line in block.splitlines() if line.strip())
          Path('project.zip').write_bytes(base64.b64decode(payload))
          PY

          unzip -o project.zip
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/java/com/sabafit/timer

      - name: Install V7 Java UI and seven-segment timer
