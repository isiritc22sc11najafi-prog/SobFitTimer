          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          if 'android:icon=' not in s:
              s = s.replace(
                  'android:label="SABAHFIT TIMER"',
                  'android:icon="@drawable/ic_launcher"\n'
                  '        android:roundIcon="@drawable/ic_launcher"\n'
                  '        android:label="SABAHFIT TIMER"'
              )
          else:
              import re
              s = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/ic_launcher"', s)
              s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/ic_launcher"', s)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Boost coach whistle for phone speakers
        run: |
          ffmpeg -y             -i "referee's-whistle (2).mp3"             -af "highpass=f=500,loudnorm=I=-9:TP=-0.5:LRA=3"             -ar 44100 -ac 2 -b:a 192k             app/src/main/res/raw/referee_whistle.mp3

      - name: Set V10 version
        run: |
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 120/' app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "12.0"/' app/build.gradle
          grep -E 'versionCode|versionName' app/build.gradle

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SABAHFIT-TIMER-v12-HEADER-COACH-APK
          path: app/build/outputs/apk/debug/app-debug.apk
