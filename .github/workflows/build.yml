name: Build SABAHFIT TIMER APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project files
        run: |
          mkdir -p app/src/main/java/com/sabafit/timer
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/drawable-nodpi

          cp IMG_20260908_005331.jpg app/src/main/res/drawable-nodpi/sabahfit_logo.jpg

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SABAHFIT-TIMER"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sabafit.timer'
              compileSdk 35

              defaultConfig {
                  applicationId "com.sabafit.timer"
                  minSdk 21
                  targetSdk 35
                  versionCode 4
                  versionName "4.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="SABAHFIT TIMER"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".WorkoutActivity"
                      android:screenOrientation="portrait"
                      android:exported="false" />

                  <activity
                      android:name=".SetupActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          python3 - <<'PY'
          import os, wave, struct, math

          os.makedirs("app/src/main/res/raw", exist_ok=True)
          path = "app/src/main/res/raw/coach_whistle.wav"

          sample_rate = 44100
          duration = 0.95
          total = int(sample_rate * duration)

          with wave.open(path, "w") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(sample_rate)

              for i in range(total):
                  t = i / sample_rate
                  base = 1950 + 480 * math.sin(2 * math.pi * 3.5 * t)
                  flutter = 120 * math.sin(2 * math.pi * 18 * t)
                  freq = base + flutter
                  attack = min(1.0, t / 0.04)
                  release = min(1.0, (duration - t) / 0.14)
                  env = max(0.0, min(attack, release))
                  s = math.sin(2 * math.pi * freq * t)
                  s += 0.40 * math.sin(2 * math.pi * freq * 2 * t)
                  s += 0.14 * math.sin(2 * math.pi * freq * 3 * t)
                  s *= 0.80 * env
                  value = int(max(-1.0, min(1.0, s)) * 32767)
                  wf.writeframes(struct.pack('<h', value))
          PY

          cat > app/src/main/java/com/sabafit/timer/SetupActivity.java <<'EOF'
          package com.sabafit.timer;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.List;

          public class SetupActivity extends Activity {

              private static final String PREFS = "sabahfit_prefs";

              private static final int BG = Color.rgb(7, 23, 41);
              private static final int CARD = Color.rgb(13, 31, 54);
              private static final int FIELD = Color.rgb(18, 42, 71);
              private static final int ORANGE = Color.rgb(255, 132, 0);
              private static final int WHITE = Color.WHITE;
              private static final int LIGHT = Color.rgb(225, 232, 238);
              private static final int SOFT = Color.rgb(155, 175, 190);
              private static final int MINT = Color.rgb(86, 233, 179);

              private EditText exerciseCountInput;
              private EditText workInput;
              private EditText restInput;
              private EditText setsInput;
              private EditText roundsInput;
              private EditText roundRestInput;

              private Button applyExercisesButton;
              private Button startButton;

              private LinearLayout exerciseFieldsContainer;
              private final List<EditText> exerciseInputs = new ArrayList<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  buildInterface();
                  loadSavedSettings();
              }

              private void buildInterface() {
                  ScrollView scrollView = new ScrollView(this);
                  scrollView.setFillViewport(true);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);
                  root.setPadding(dp(18), dp(18), dp(18), dp(28));

                  root.addView(makeHeader());

                  LinearLayout settingsCard = new LinearLayout(this);
                  settingsCard.setOrientation(LinearLayout.VERTICAL);
                  settingsCard.setBackgroundColor(CARD);
                  settingsCard.setPadding(dp(16), dp(16), dp(16), dp(16));

                  TextView title = makeText("تنظیمات تمرین", 22, WHITE, true);
                  LinearLayout.LayoutParams titleParams = fullWidth();
                  titleParams.bottomMargin = dp(8);
                  settingsCard.addView(title, titleParams);

                  exerciseCountInput = addNumberField(settingsCard, "تعداد تمرین‌ها (1 تا 10)", "3");

                  applyExercisesButton = makeSecondaryButton("اعمال تعداد تمرین");
                  LinearLayout.LayoutParams applyParams = fullWidth();
                  applyParams.topMargin = dp(8);
                  settingsCard.addView(applyExercisesButton, applyParams);

                  workInput = addNumberField(settingsCard, "زمان هر تمرین (ثانیه)", "100");
                  restInput = addNumberField(settingsCard, "استراحت بین تمرین‌ها (ثانیه)", "20");
                  setsInput = addNumberField(settingsCard, "تعداد ست", "3");
                  roundsInput = addNumberField(settingsCard, "تعداد راند", "2");
                  roundRestInput = addNumberField(settingsCard, "استراحت بین راندها (ثانیه)", "180");

                  TextView exercisesLabel = makeText("نام تمرین‌ها", 18, WHITE, true);
                  LinearLayout.LayoutParams exParams = fullWidth();
                  exParams.topMargin = dp(12);
                  exParams.bottomMargin = dp(6);
                  settingsCard.addView(exercisesLabel, exParams);

                  exerciseFieldsContainer = new LinearLayout(this);
                  exerciseFieldsContainer.setOrientation(LinearLayout.VERTICAL);
                  settingsCard.addView(exerciseFieldsContainer, fullWidth());

                  root.addView(settingsCard, fullWidth());

                  startButton = makePrimaryButton("شروع تمرین");
                  LinearLayout.LayoutParams startParams = fullWidth();
                  startParams.topMargin = dp(18);
                  root.addView(startButton, startParams);

                  TextView note = makeText(
                          "تنظیمات شما ذخیره می‌شود و در اجرای بعدی باقی می‌ماند.",
                          12,
                          SOFT,
                          false
                  );
                  note.setGravity(Gravity.CENTER_HORIZONTAL);
                  LinearLayout.LayoutParams noteParams = fullWidth();
                  noteParams.topMargin = dp(12);
                  root.addView(note, noteParams);

                  scrollView.addView(root);
                  setContentView(scrollView);

                  applyExercisesButton.setOnClickListener(v -> applyExerciseCount());
                  startButton.setOnClickListener(v -> startWorkout());

                  generateExerciseInputs(3, null);
              }

              private LinearLayout makeHeader() {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setBackgroundColor(CARD);
                  card.setPadding(dp(18), dp(18), dp(18), dp(16));

                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.sabahfit_logo);
                  logo.setAdjustViewBounds(true);
                  logo.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  LinearLayout.LayoutParams logoParams =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  dp(120)
                          );
                  card.addView(logo, logoParams);

                  TextView en = makeText("SABAHFIT TIMER", 22, WHITE, true);
                  en.setGravity(Gravity.CENTER_HORIZONTAL);
                  LinearLayout.LayoutParams enParams = fullWidth();
                  enParams.topMargin = dp(10);
                  card.addView(en, enParams);

                  TextView slogan = makeText("حرکت | سلامتی | قدرت", 14, LIGHT, false);
                  slogan.setGravity(Gravity.CENTER_HORIZONTAL);
                  LinearLayout.LayoutParams sParams = fullWidth();
                  sParams.topMargin = dp(6);
                  card.addView(slogan, sParams);

                  return card;
              }

              private void generateExerciseInputs(int count, ArrayList<String> existingNames) {
                  exerciseFieldsContainer.removeAllViews();
                  exerciseInputs.clear();

                  String[] defaults = new String[]{
                          "Burpee", "Lift", "Push Press", "Squat", "Push-up",
                          "Lunge", "Plank", "Deadlift", "Jumping Jack", "Sit-up"
                  };

                  for (int i = 0; i < count; i++) {
                      TextView label = makeText("تمرین " + (i + 1), 14, LIGHT, false);
                      LinearLayout.LayoutParams lp = fullWidth();
                      lp.topMargin = dp(6);
                      exerciseFieldsContainer.addView(label, lp);

                      EditText input = new EditText(this);
                      input.setSingleLine(true);
                      input.setTextColor(WHITE);
                      input.setHintTextColor(SOFT);
                      input.setBackgroundColor(FIELD);
                      input.setPadding(dp(14), dp(12), dp(14), dp(12));

                      String value;
                      if (existingNames != null && i < existingNames.size()) {
                          value = existingNames.get(i);
                      } else {
                          value = defaults[i];
                      }

                      input.setText(value);

                      LinearLayout.LayoutParams ip = fullWidth();
                      ip.topMargin = dp(4);
                      ip.bottomMargin = dp(4);
                      exerciseFieldsContainer.addView(input, ip);
                      exerciseInputs.add(input);
                  }
              }

              private void applyExerciseCount() {
                  try {
                      int count = parseIntInRange(exerciseCountInput, 1, 10);
                      ArrayList<String> current = getCurrentExerciseNames();
                      generateExerciseInputs(count, current);
                      Toast.makeText(this, "تعداد تمرین‌ها به‌روزرسانی شد", Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "تعداد تمرین باید بین 1 تا 10 باشد", Toast.LENGTH_LONG).show();
                  }
              }

              private ArrayList<String> getCurrentExerciseNames() {
                  ArrayList<String> list = new ArrayList<>();
                  for (int i = 0; i < exerciseInputs.size(); i++) {
                      String s = exerciseInputs.get(i).getText().toString().trim();
                      if (s.isEmpty()) s = "Exercise " + (i + 1);
                      list.add(s);
                  }
                  return list;
              }

              private void startWorkout() {
                  try {
                      int exerciseCount = parseIntInRange(exerciseCountInput, 1, 10);
                      int work = parseIntInRange(workInput, 1, 3600);
                      int rest = parseIntInRange(restInput, 0, 3600);
                      int sets = parseIntInRange(setsInput, 1, 100);
                      int rounds = parseIntInRange(roundsInput, 1, 100);
                      int roundRest = parseIntInRange(roundRestInput, 0, 3600);

                      if (exerciseInputs.size() != exerciseCount) {
                          generateExerciseInputs(exerciseCount, getCurrentExerciseNames());
                      }

                      ArrayList<String> exercises = getCurrentExerciseNames();
                      while (exercises.size() > exerciseCount) {
                          exercises.remove(exercises.size() - 1);
                      }

                      saveSettings(exerciseCount, work, rest, sets, rounds, roundRest, exercises);

                      Intent intent = new Intent(this, WorkoutActivity.class);
                      intent.putExtra("exerciseCount", exerciseCount);
                      intent.putExtra("work", work);
                      intent.putExtra("rest", rest);
                      intent.putExtra("sets", sets);
                      intent.putExtra("rounds", rounds);
                      intent.putExtra("roundRest", roundRest);
                      intent.putStringArrayListExtra("exerciseNames", exercises);
                      startActivity(intent);

                  } catch (Exception e) {
                      Toast.makeText(this, "لطفاً همه تنظیمات را درست وارد کنید", Toast.LENGTH_LONG).show();
                  }
              }

              private void saveSettings(
                      int exerciseCount,
                      int work,
                      int rest,
                      int sets,
                      int rounds,
                      int roundRest,
                      ArrayList<String> exercises
              ) {
                  SharedPreferences sp = getSharedPreferences(PREFS, MODE_PRIVATE);
                  SharedPreferences.Editor ed = sp.edit();

                  ed.putInt("exerciseCount", exerciseCount);
                  ed.putInt("work", work);
                  ed.putInt("rest", rest);
                  ed.putInt("sets", sets);
                  ed.putInt("rounds", rounds);
                  ed.putInt("roundRest", roundRest);

                  for (int i = 0; i < 10; i++) {
                      String value = i < exercises.size() ? exercises.get(i) : "";
                      ed.putString("exercise_" + i, value);
                  }

                  ed.apply();
              }

              private void loadSavedSettings() {
                  SharedPreferences sp = getSharedPreferences(PREFS, MODE_PRIVATE);

                  int exerciseCount = sp.getInt("exerciseCount", 3);
                  exerciseCountInput.setText(String.valueOf(exerciseCount));
                  workInput.setText(String.valueOf(sp.getInt("work", 100)));
                  restInput.setText(String.valueOf(sp.getInt("rest", 20)));
                  setsInput.setText(String.valueOf(sp.getInt("sets", 3)));
                  roundsInput.setText(String.valueOf(sp.getInt("rounds", 2)));
                  roundRestInput.setText(String.valueOf(sp.getInt("roundRest", 180)));

                  ArrayList<String> names = new ArrayList<>();
                  for (int i = 0; i < exerciseCount; i++) {
                      String v = sp.getString("exercise_" + i, "");
                      if (v == null || v.trim().isEmpty()) {
                          String[] defaults = new String[]{
                                  "Burpee", "Lift", "Push Press", "Squat", "Push-up",
                                  "Lunge", "Plank", "Deadlift", "Jumping Jack", "Sit-up"
                          };
                          v = defaults[i];
                      }
                      names.add(v);
                  }

                  generateExerciseInputs(exerciseCount, names);
              }

              private int parseIntInRange(EditText e, int min, int max) {
                  int value = Integer.parseInt(e.getText().toString().trim());
                  if (value < min || value > max) throw new RuntimeException();
                  return value;
              }

              private EditText addNumberField(LinearLayout parent, String label, String value) {
                  TextView tv = makeText(label, 14, LIGHT, false);
                  LinearLayout.LayoutParams tvp = fullWidth();
                  tvp.topMargin = dp(8);
                  parent.addView(tv, tvp);

                  EditText input = new EditText(this);
                  input.setInputType(InputType.TYPE_CLASS_NUMBER);
                  input.setSingleLine(true);
                  input.setText(value);
                  input.setTextColor(WHITE);
                  input.setHintTextColor(SOFT);
                  input.setBackgroundColor(FIELD);
                  input.setPadding(dp(14), dp(12), dp(14), dp(12));

                  LinearLayout.LayoutParams ip = fullWidth();
                  ip.topMargin = dp(4);
                  parent.addView(input, ip);

                  return input;
              }

              private TextView makeText(String text, int size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              private Button makePrimaryButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setTextColor(BG);
                  b.setTextSize(20);
                  b.setTypeface(Typeface.DEFAULT_BOLD);
                  b.setBackgroundColor(MINT);
                  b.setPadding(dp(10), dp(14), dp(10), dp(14));
                  return b;
              }

              private Button makeSecondaryButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setTextColor(WHITE);
                  b.setTextSize(16);
                  b.setTypeface(Typeface.DEFAULT_BOLD);
                  b.setBackgroundColor(Color.rgb(28, 56, 90));
                  b.setPadding(dp(10), dp(12), dp(10), dp(12));
                  return b;
              }

              private LinearLayout.LayoutParams fullWidth() {
                  return new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                  );
              }

              private int dp(int value) {
                  float density = getResources().getDisplayMetrics().density;
                  return Math.round(value * density);
              }
          }
