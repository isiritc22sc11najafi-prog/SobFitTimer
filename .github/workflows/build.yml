name: Build SABAFIT TIMER APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project files
        run: |
          mkdir -p app/src/main/java/com/sabafit/timer
          mkdir -p app/src/main/res/raw

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SABAFIT-TIMER"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sabafit.timer'
              compileSdk 35

              defaultConfig {
                  applicationId "com.sabafit.timer"
                  minSdk 21
                  targetSdk 35
                  versionCode 2
                  versionName "2.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="SABAFIT TIMER"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          python3 - <<'PY'
          import os, wave, struct, math

          os.makedirs("app/src/main/res/raw", exist_ok=True)
          path = "app/src/main/res/raw/coach_whistle.wav"

          sample_rate = 44100
          duration = 0.75
          total = int(sample_rate * duration)

          with wave.open(path, "w") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(sample_rate)

              for i in range(total):
                  t = i / sample_rate

                  base = 1800 + 500 * math.sin(2 * math.pi * 3.4 * t)
                  chirp = 300 * math.sin(2 * math.pi * 8.0 * t)
                  freq = base + chirp

                  env_attack = min(1.0, t / 0.06)
                  env_release = min(1.0, (duration - t) / 0.12)
                  env = max(0.0, min(env_attack, env_release))

                  vibrato = 1.0 + 0.01 * math.sin(2 * math.pi * 12.0 * t)
                  sample = math.sin(2 * math.pi * freq * vibrato * t)
                  sample += 0.35 * math.sin(2 * math.pi * (freq * 2.0) * t)
                  sample *= 0.72 * env

                  value = int(max(-1.0, min(1.0, sample)) * 32767)
                  wf.writeframes(struct.pack('<h', value))
          PY

          cat > app/src/main/java/com/sabafit/timer/MainActivity.java <<'EOF'
          package com.sabafit.timer;

          import android.app.Activity;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.media.AudioAttributes;
          import android.media.SoundPool;
          import android.os.Bundle;
          import android.os.CountDownTimer;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private final Handler handler = new Handler(Looper.getMainLooper());

              private TextView phaseText;
              private TextView timerText;
              private TextView exerciseText;
              private TextView progressText;

              private EditText workInput;
              private EditText restInput;
              private EditText setsInput;
              private EditText roundsInput;
              private EditText roundRestInput;
              private EditText exerciseCountInput;

              private Button applyExercisesButton;
              private Button startPauseButton;
              private Button resetButton;

              private LinearLayout exerciseFieldsContainer;
              private final List<EditText> exerciseInputs = new ArrayList<>();
              private final List<String> exerciseNames = new ArrayList<>();

              private ExerciseSketchView sketchView;

              private CountDownTimer timer;
              private long remainingMs = 0;
              private Runnable finishAction;

              private boolean started = false;
              private boolean paused = false;

              private int workSeconds = 100;
              private int restSeconds = 20;
              private int totalSets = 3;
              private int totalRounds = 2;
              private int roundRestSeconds = 180;
              private int exerciseCount = 3;

              private int currentExercise = 0;
              private int currentSet = 1;
              private int currentRound = 1;

              private SoundPool soundPool;
              private int whistleSoundId = 0;
              private boolean whistleLoaded = false;

              private static final int BG = Color.rgb(7, 23, 41);
              private static final int CARD = Color.rgb(13, 31, 54);
              private static final int ORANGE = Color.rgb(255, 132, 0);
              private static final int MINT = Color.rgb(86, 233, 179);
              private static final int WHITE = Color.WHITE;
              private static final int LIGHT = Color.rgb(220, 228, 235);
              private static final int SOFT = Color.rgb(160, 175, 190);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  initSound();
                  buildInterface();
                  generateExerciseInputs(3);
                  showIdle();
              }

              private void initSound() {
                  AudioAttributes attributes = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build();

                  soundPool = new SoundPool.Builder()
                          .setMaxStreams(3)
                          .setAudioAttributes(attributes)
                          .build();

                  soundPool.setOnLoadCompleteListener((sp, sampleId, status) -> {
                      whistleLoaded = (status == 0);
                  });

                  whistleSoundId = soundPool.load(this, R.raw.coach_whistle, 1);
              }

              private void buildInterface() {
                  ScrollView scrollView = new ScrollView(this);
                  scrollView.setFillViewport(true);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(18), dp(18), dp(18), dp(26));
                  root.setBackgroundColor(BG);

                  root.addView(makeHeaderCard());

                  phaseText = makeText("READY", 24, MINT, true);
                  phaseText.setGravity(Gravity.CENTER_HORIZONTAL);
                  LinearLayout.LayoutParams phaseParams = fullWidth();
                  phaseParams.topMargin = dp(18);
                  root.addView(phaseText, phaseParams);

                  timerText = makeText("00:00", 58, WHITE, true);
                  timerText.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.addView(timerText, fullWidth());

                  exerciseText = makeText("EXERCISE 1", 22, WHITE, true);
                  exerciseText.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.addView(exerciseText, fullWidth());

                  progressText = makeText("EX 1/3   SET 1/3   ROUND 1/2", 14, LIGHT, false);
                  progressText.setGravity(Gravity.CENTER_HORIZONTAL);
                  LinearLayout.LayoutParams progressParams = fullWidth();
                  progressParams.bottomMargin = dp(14);
                  root.addView(progressText, progressParams);

                  sketchView = new ExerciseSketchView(this);
                  LinearLayout.LayoutParams sketchParams =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  dp(210)
                          );
                  sketchParams.bottomMargin = dp(18);
                  root.addView(sketchView, sketchParams);

                  root.addView(makeSettingsCard());

                  startPauseButton = makePrimaryButton("START");
                  LinearLayout.LayoutParams startParams = fullWidth();
                  startParams.topMargin = dp(18);
                  root.addView(startPauseButton, startParams);

                  resetButton = makeSecondaryButton("RESET");
                  LinearLayout.LayoutParams resetParams = fullWidth();
                  resetParams.topMargin = dp(10);
                  root.addView(resetButton, resetParams);

                  TextView footer = makeText(
                          "Coach whistle • Dynamic exercises (1 to 10) • Editable exercise names",
                          12,
                          SOFT,
                          false
                  );
                  footer.setGravity(Gravity.CENTER_HORIZONTAL);
                  LinearLayout.LayoutParams footerParams = fullWidth();
                  footerParams.topMargin = dp(16);
                  root.addView(footer, footerParams);

                  scrollView.addView(root);
                  setContentView(scrollView);

                  applyExercisesButton.setOnClickListener(v -> applyExerciseCountFromField());
                  startPauseButton.setOnClickListener(v -> handleStartPause());
                  resetButton.setOnClickListener(v -> resetWorkout());
              }

              private View makeHeaderCard() {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setBackgroundColor(CARD);
                  card.setPadding(dp(18), dp(18), dp(18), dp(16));

                  TextView brandFa = makeText("صبا فیت", 28, ORANGE, true);
                  brandFa.setGravity(Gravity.CENTER_HORIZONTAL);
                  card.addView(brandFa, fullWidth());

                  TextView brandEn = makeText("SABAFIT TIMER", 18, WHITE, true);
                  brandEn.setGravity(Gravity.CENTER_HORIZONTAL);
                  card.addView(brandEn, fullWidth());

                  TextView slogan = makeText("حرکت  |  سلامتی  |  قدرت", 14, LIGHT, false);
                  slogan.setGravity(Gravity.CENTER_HORIZONTAL);
                  LinearLayout.LayoutParams sloganParams = fullWidth();
                  sloganParams.topMargin = dp(6);
                  card.addView(slogan, sloganParams);

                  return card;
              }

              private View makeSettingsCard() {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setBackgroundColor(CARD);
                  card.setPadding(dp(16), dp(16), dp(16), dp(16));

                  exerciseCountInput = addLabeledNumberInput(
                          card,
                          "Number of exercises (1 to 10)",
                          "3"
                  );

                  applyExercisesButton = makeSecondaryButton("APPLY EXERCISE COUNT");
                  LinearLayout.LayoutParams applyParams = fullWidth();
                  applyParams.topMargin = dp(8);
                  applyParams.bottomMargin = dp(10);
                  card.addView(applyExercisesButton, applyParams);

                  workInput = addLabeledNumberInput(
                          card,
                          "Exercise time (seconds)",
                          "100"
                  );

                  restInput = addLabeledNumberInput(
                          card,
                          "Rest between exercises (seconds)",
                          "20"
                  );

                  setsInput = addLabeledNumberInput(
                          card,
                          "Sets",
                          "3"
                  );

                  roundsInput = addLabeledNumberInput(
                          card,
                          "Rounds",
                          "2"
                  );

                  roundRestInput = addLabeledNumberInput(
                          card,
                          "Rest between rounds (seconds)",
                          "180"
                  );

                  TextView exTitle = makeText("Exercise names", 18, WHITE, true);
                  LinearLayout.LayoutParams titleParams = fullWidth();
                  titleParams.topMargin = dp(12);
                  titleParams.bottomMargin = dp(8);
                  card.addView(exTitle, titleParams);

                  HorizontalScrollView hsv = new HorizontalScrollView(this);
                  hsv.setFillViewport(true);

                  exerciseFieldsContainer = new LinearLayout(this);
                  exerciseFieldsContainer.setOrientation(LinearLayout.VERTICAL);

                  hsv.addView(
                          exerciseFieldsContainer,
                          new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                  );

                  card.addView(
                          hsv,
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                  );

                  return card;
              }

              private EditText addLabeledNumberInput(
                      LinearLayout parent,
                      String label,
                      String value
              ) {
                  TextView tv = makeText(label, 14, LIGHT, false);
                  LinearLayout.LayoutParams tvParams = fullWidth();
                  tvParams.topMargin = dp(6);
                  parent.addView(tv, tvParams);

                  EditText e = new EditText(this);
                  e.setText(value);
                  e.setInputType(InputType.TYPE_CLASS_NUMBER);
                  e.setTextColor(WHITE);
                  e.setHintTextColor(SOFT);
                  e.setSingleLine(true);
                  e.setPadding(dp(14), dp(12), dp(14), dp(12));
                  e.setBackgroundColor(Color.rgb(18, 42, 71));

                  LinearLayout.LayoutParams p = fullWidth();
                  p.topMargin = dp(4);
                  p.bottomMargin = dp(4);
                  parent.addView(e, p);

                  return e;
              }

              private void generateExerciseInputs(int count) {
                  exerciseFieldsContainer.removeAllViews();
                  exerciseInputs.clear();

                  String[] defaults = new String[] {
                          "Burpee", "Lift", "Push Press", "Squat", "Push-up",
                          "Lunge", "Plank", "Deadlift", "Jumping Jack", "Sit-up"
                  };

                  for (int i = 0; i < count; i++) {
                      TextView tv = makeText("Exercise " + (i + 1), 13, LIGHT, false);
                      LinearLayout.LayoutParams tvParams = fullWidth();
                      tvParams.topMargin = dp(4);
                      exerciseFieldsContainer.addView(tv, tvParams);

                      EditText e = new EditText(this);
                      e.setText(defaults[i]);
                      e.setHint("Enter exercise name");
                      e.setTextColor(WHITE);
                      e.setHintTextColor(SOFT);
                      e.setSingleLine(true);
                      e.setPadding(dp(14), dp(12), dp(14), dp(12));
                      e.setBackgroundColor(Color.rgb(18, 42, 71));

                      LinearLayout.LayoutParams p = fullWidth();
                      p.topMargin = dp(4);
                      p.bottomMargin = dp(6);
                      exerciseFieldsContainer.addView(e, p);

                      exerciseInputs.add(e);
                  }

                  if (!exerciseInputs.isEmpty()) {
                      String first = safeExerciseName(exerciseInputs.get(0).getText().toString(), 1);
                      exerciseText.setText(first.toUpperCase(Locale.ROOT));
                      sketchView.setExerciseName(first);
                      progressText.setText(
                              String.format(Locale.US, "EX 1/%d   SET 1/3   ROUND 1/2", count)
                      );
                  }
              }

              private void applyExerciseCountFromField() {
                  try {
                      int count = Integer.parseInt(exerciseCountInput.getText().toString().trim());

                      if (count < 1 || count > 10) {
                          throw new RuntimeException();
                      }

                      exerciseCount = count;
                      generateExerciseInputs(count);

                      Toast.makeText(
                              this,
                              "Exercise fields updated: " + count,
                              Toast.LENGTH_SHORT
                      ).show();

                  } catch (Exception ex) {
                      Toast.makeText(
                              this,
                              "Exercise count must be between 1 and 10.",
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }

              private void handleStartPause() {
                  if (!started) {
                      if (!readSettings()) return;

                      started = true;
                      paused = false;

                      currentExercise = 0;
                      currentSet = 1;
                      currentRound = 1;

                      disableInputs(true);
                      startReady();

                  } else if (!paused) {
                      pauseWorkout();
                  } else {
                      resumeWorkout();
                  }
              }

              private boolean readSettings() {
                  try {
                      workSeconds = parsePositive(workInput, 1, 3600);
                      restSeconds = parsePositive(restInput, 0, 3600);
                      totalSets = parsePositive(setsInput, 1, 100);
                      totalRounds = parsePositive(roundsInput, 1, 100);
                      roundRestSeconds = parsePositive(roundRestInput, 0, 3600);
                      exerciseCount = parsePositive(exerciseCountInput, 1, 10);

                      if (exerciseInputs.size() != exerciseCount) {
                          generateExerciseInputs(exerciseCount);
                      }

                      exerciseNames.clear();
                      for (int i = 0; i < exerciseCount; i++) {
                          String raw = exerciseInputs.get(i).getText().toString().trim();
                          exerciseNames.add(safeExerciseName(raw, i + 1));
                      }

                      return true;

                  } catch (Exception ex) {
                      Toast.makeText(
                              this,
                              "Please check all settings.",
                              Toast.LENGTH_LONG
                      ).show();
                      return false;
                  }
              }

              private int parsePositive(EditText editText, int min, int max) {
                  int value = Integer.parseInt(editText.getText().toString().trim());
                  if (value < min || value > max) throw new RuntimeException();
                  return value;
              }

              private String safeExerciseName(String raw, int number) {
                  if (raw == null || raw.trim().isEmpty()) {
                      return "Exercise " + number;
                  }
                  return raw.trim();
              }

              private void startReady() {
                  handler.removeCallbacksAndMessages(null);

                  phaseText.setText("READY");
                  timerText.setText("00:03");
                  exerciseText.setText(exerciseNames.get(0).toUpperCase(Locale.ROOT));
                  sketchView.setExerciseName(exerciseNames.get(0));
                  updateProgress();

                  tripleWhistle();

                  runTimer(3000, this::startWork);
              }

              private void startWork() {
                  phaseText.setText("WORK");
                  String currentName = exerciseNames.get(currentExercise);

                  exerciseText.setText(currentName.toUpperCase(Locale.ROOT));
                  sketchView.setExerciseName(currentName);
                  updateProgress();
                  whistle();

                  runTimer(workSeconds * 1000L, this::workFinished);
              }

              private void workFinished() {
                  whistle();

                  if (currentExercise < exerciseCount - 1) {
                      currentExercise++;
                      startExerciseRest(() -> startWork());
                      return;
                  }

                  if (currentSet < totalSets) {
                      currentSet++;
                      currentExercise = 0;
                      startExerciseRest(() -> startWork());
                      return;
                  }

                  if (currentRound < totalRounds) {
                      currentRound++;
                      currentSet = 1;
                      currentExercise = 0;
                      startRoundRest();
                      return;
                  }

                  finishWorkout();
              }

              private void startExerciseRest(Runnable nextAction) {
                  phaseText.setText("REST");
                  String nextName = exerciseNames.get(currentExercise);

                  exerciseText.setText(("NEXT: " + nextName).toUpperCase(Locale.ROOT));
                  sketchView.setExerciseName(nextName);
                  updateProgress();

                  runTimer(restSeconds * 1000L, nextAction);
              }

              private void startRoundRest() {
                  phaseText.setText("ROUND REST");
                  String nextName = exerciseNames.get(0);

                  exerciseText.setText(("NEXT ROUND: " + nextName).toUpperCase(Locale.ROOT));
                  sketchView.setExerciseName(nextName);
                  updateProgress();

                  runTimer(roundRestSeconds * 1000L, this::startWork);
              }

              private void runTimer(long durationMs, Runnable whenFinished) {
                  if (timer != null) timer.cancel();

                  finishAction = whenFinished;
                  remainingMs = durationMs;

                  if (durationMs <= 0) {
                      displayTime(0);
                      if (finishAction != null) finishAction.run();
                      return;
                  }

                  timer = new CountDownTimer(durationMs, 250) {
                      @Override
                      public void onTick(long millisUntilFinished) {
                          remainingMs = millisUntilFinished;
                          long seconds = (millisUntilFinished + 999) / 1000;
                          displayTime(seconds);
                      }

                      @Override
                      public void onFinish() {
                          remainingMs = 0;
                          displayTime(0);
                          if (finishAction != null) finishAction.run();
                      }
                  };

                  timer.start();
                  startPauseButton.setText("PAUSE");
              }

              private void pauseWorkout() {
                  if (timer != null) timer.cancel();

                  paused = true;
                  phaseText.setText("PAUSED");
                  startPauseButton.setText("RESUME");
              }

              private void resumeWorkout() {
                  paused = false;
                  runTimer(remainingMs, finishAction);
              }

              private void finishWorkout() {
                  started = false;
                  paused = false;

                  if (timer != null) timer.cancel();
                  timerText.setText("00:00");
                  phaseText.setText("WORKOUT COMPLETE");
                  exerciseText.setText("GREAT JOB!");
                  sketchView.setExerciseName("done");
                  startPauseButton.setText("START");

                  disableInputs(false);
                  tripleWhistle();
              }

              private void resetWorkout() {
                  if (timer != null) timer.cancel();

                  handler.removeCallbacksAndMessages(null);

                  started = false;
                  paused = false;
                  remainingMs = 0;
                  currentExercise = 0;
                  currentSet = 1;
                  currentRound = 1;

                  disableInputs(false);
                  startPauseButton.setText("START");
                  showIdle();
              }

              private void showIdle() {
                  phaseText.setText("READY");
                  timerText.setText("00:00");

                  String firstName = exerciseInputs.isEmpty()
                          ? "Exercise 1"
                          : safeExerciseName(exerciseInputs.get(0).getText().toString(), 1);

                  exerciseText.setText(firstName.toUpperCase(Locale.ROOT));
                  sketchView.setExerciseName(firstName);

                  progressText.setText(
                          String.format(Locale.US, "EX 1/%d   SET 1/3   ROUND 1/2", Math.max(1, exerciseInputs.size()))
                  );
              }

              private void updateProgress() {
                  progressText.setText(
                          String.format(
                                  Locale.US,
                                  "EX %d/%d   SET %d/%d   ROUND %d/%d",
                                  currentExercise + 1,
                                  exerciseCount,
                                  currentSet,
                                  totalSets,
                                  currentRound,
                                  totalRounds
                          )
                  );
              }

              private void displayTime(long seconds) {
                  long min = seconds / 60;
                  long sec = seconds % 60;
                  timerText.setText(String.format(Locale.US, "%02d:%02d", min, sec));
              }

              private void whistle() {
                  if (soundPool != null && whistleLoaded) {
                      soundPool.play(whistleSoundId, 1f, 1f, 1, 0, 1f);
                  }
              }

              private void tripleWhistle() {
                  whistle();
                  handler.postDelayed(this::whistle, 900);
                  handler.postDelayed(this::whistle, 1800);
              }

              private void disableInputs(boolean disabled) {
                  boolean enabled = !disabled;

                  workInput.setEnabled(enabled);
                  restInput.setEnabled(enabled);
                  setsInput.setEnabled(enabled);
                  roundsInput.setEnabled(enabled);
                  roundRestInput.setEnabled(enabled);
                  exerciseCountInput.setEnabled(enabled);
                  applyExercisesButton.setEnabled(enabled);

                  for (EditText e : exerciseInputs) {
                      e.setEnabled(enabled);
                  }
              }

              private TextView makeText(String text, int sizeSp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(sizeSp);
                  t.setTextColor(color);
                  if (bold) {
                      t.setTypeface(t.getTypeface(), android.graphics.Typeface.BOLD);
                  }
                  return t;
              }

              private Button makePrimaryButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(20);
                  b.setAllCaps(true);
                  b.setTextColor(BG);
                  b.setBackgroundColor(MINT);
                  b.setPadding(dp(10), dp(14), dp(10), dp(14));
                  return b;
              }

              private Button makeSecondaryButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(16);
                  b.setAllCaps(true);
                  b.setTextColor(WHITE);
                  b.setBackgroundColor(Color.rgb(26, 52, 84));
                  b.setPadding(dp(10), dp(12), dp(10), dp(12));
                  return b;
              }

              private LinearLayout.LayoutParams fullWidth() {
                  return new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                  );
              }

              private int dp(int value) {
                  float density = getResources().getDisplayMetrics().density;
                  return Math.round(value * density);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();

                  if (timer != null) timer.cancel();
                  handler.removeCallbacksAndMessages(null);

                  if (soundPool != null) {
                      soundPool.release();
                      soundPool = null;
                  }
              }

              private class ExerciseSketchView extends View {

                  private final Paint borderPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint linePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint textPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint accentPaint = new Paint(Paint.ANTI_ALIAS_FLAG);

                  private String exerciseName = "exercise";

                  public ExerciseSketchView(Activity context) {
                      super(context);

                      borderPaint.setStyle(Paint.Style.STROKE);
                      borderPaint.setStrokeWidth(dp(2));
                      borderPaint.setColor(Color.rgb(38, 72, 112));

                      linePaint.setStyle(Paint.Style.STROKE);
                      linePaint.setStrokeWidth(dp(4));
                      linePaint.setStrokeCap(Paint.Cap.ROUND);
                      linePaint.setColor(WHITE);

                      accentPaint.setStyle(Paint.Style.FILL);
                      accentPaint.setColor(Color.argb(28, 255, 132, 0));

                      textPaint.setColor(SOFT);
                      textPaint.setTextSize(dp(8));
                      textPaint.setTextAlign(Paint.Align.CENTER);
                  }

                  public void setExerciseName(String name) {
                      if (name == null) {
                          exerciseName = "exercise";
                      } else {
                          exerciseName = name.trim().toLowerCase(Locale.ROOT);
                      }
                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);

                      float w = getWidth();
                      float h = getHeight();

                      RectF card = new RectF(dp(4), dp(4), w - dp(4), h - dp(4));
                      canvas.drawRoundRect(card, dp(16), dp(16), accentPaint);
                      canvas.drawRoundRect(card, dp(16), dp(16), borderPaint);

                      String title = exerciseName == null || exerciseName.isEmpty()
                              ? "exercise"
                              : exerciseName.toUpperCase(Locale.ROOT);
                      canvas.drawText(title, w / 2f, dp(24), textPaint);

                      if (exerciseName.contains("burpee") || exerciseName.contains("برپی")) {
                          drawBurpee(canvas, w, h);
                      } else if (exerciseName.contains("squat") || exerciseName.contains("اسکات")) {
                          drawSquat(canvas, w, h);
                      } else if (exerciseName.contains("push") || exerciseName.contains("شنا")) {
                          drawPush(canvas, w, h);
                      } else if (exerciseName.contains("lunge") || exerciseName.contains("لانج")) {
                          drawLunge(canvas, w, h);
                      } else if (exerciseName.contains("plank") || exerciseName.contains("پلانک")) {
                          drawPlank(canvas, w, h);
                      } else if (exerciseName.contains("deadlift") || exerciseName.contains("دد")) {
                          drawDeadlift(canvas, w, h);
                      } else if (exerciseName.contains("press") || exerciseName.contains("پرس")) {
                          drawPress(canvas, w, h);
                      } else if (exerciseName.contains("sit") || exerciseName.contains("crunch") || exerciseName.contains("دراز")) {
                          drawSitup(canvas, w, h);
                      } else if (exerciseName.contains("jump") || exerciseName.contains("جامپ")) {
                          drawJumpingJack(canvas, w, h);
                      } else if (exerciseName.contains("done")) {
                          drawDone(canvas, w, h);
                      } else {
                          drawGeneric(canvas, w, h);
                      }
                  }

                  private void drawHead(Canvas c, float x, float y, float r) {
                      c.drawCircle(x, y, r, linePaint);
                  }

                  private void drawBurpee(Canvas c, float w, float h) {
                      drawHead(c, w * 0.30f, h * 0.34f, dp(12));
                      c.drawLine(w * 0.30f, h * 0.40f, w * 0.30f, h * 0.56f, linePaint);
                      c.drawLine(w * 0.30f, h * 0.45f, w * 0.22f, h * 0.52f, linePaint);
                      c.drawLine(w * 0.30f, h * 0.45f, w * 0.38f, h * 0.52f, linePaint);
                      c.drawLine(w * 0.30f, h * 0.56f, w * 0.24f, h * 0.70f, linePaint);
                      c.drawLine(w * 0.30f, h * 0.56f, w * 0.36f, h * 0.70f, linePaint);

                      drawHead(c, w * 0.72f, h * 0.48f, dp(12));
                      c.drawLine(w * 0.68f, h * 0.55f, w * 0.46f, h * 0.62f, linePaint);
                      c.drawLine(w * 0.68f, h * 0.55f, w * 0.84f, h * 0.60f, linePaint);
                      c.drawLine(w * 0.52f, h * 0.62f, w * 0.42f, h * 0.72f, linePaint);
                      c.drawLine(w * 0.52f, h * 0.62f, w * 0.68f, h * 0.72f, linePaint);
                  }

                  private void drawSquat(Canvas c, float w, float h) {
                      float x = w * 0.50f;
                      drawHead(c, x, h * 0.26f, dp(13));
                      c.drawLine(x, h * 0.32f, x, h * 0.52f, linePaint);
                      c.drawLine(x, h * 0.38f, x - dp(36), h * 0.44f, linePaint);
                      c.drawLine(x, h * 0.38f, x + dp(36), h * 0.44f, linePaint);
                      c.drawLine(x, h * 0.52f, x - dp(34), h * 0.62f, linePaint);
                      c.drawLine(x - dp(34), h * 0.62f, x - dp(16), h * 0.74f, linePaint);
                      c.drawLine(x, h * 0.52f, x + dp(34), h * 0.62f, linePaint);
                      c.drawLine(x + dp(34), h * 0.62f, x + dp(16), h * 0.74f, linePaint);
                  }

                  private void drawPush(Canvas c, float w, float h) {
                      drawHead(c, w * 0.24f, h * 0.50f, dp(11));
                      c.drawLine(w * 0.30f, h * 0.50f, w * 0.68f, h * 0.50f, linePaint);
                      c.drawLine(w * 0.36f, h * 0.50f, w * 0.30f, h * 0.68f, linePaint);
                      c.drawLine(w * 0.60f, h * 0.50f, w * 0.68f, h * 0.68f, linePaint);
                      c.drawLine(w * 0.68f, h * 0.50f, w * 0.82f, h * 0.50f, linePaint);
                  }

                  private void drawLunge(Canvas c, float w, float h) {
                      float x = w * 0.48f;
                      drawHead(c, x, h * 0.24f, dp(13));
                      c.drawLine(x, h * 0.30f, x, h * 0.52f, linePaint);
                      c.drawLine(x, h * 0.38f, x - dp(34), h * 0.46f, linePaint);
                      c.drawLine(x, h * 0.38f, x + dp(36), h * 0.42f, linePaint);
                      c.drawLine(x, h * 0.52f, x - dp(42), h * 0.66f, linePaint);
                      c.drawLine(x - dp(42), h * 0.66f, x - dp(42), h * 0.78f, linePaint);
                      c.drawLine(x, h * 0.52f, x + dp(30), h * 0.58f, linePaint);
                      c.drawLine(x + dp(30), h * 0.58f, x + dp(52), h * 0.74f, linePaint);
                  }

                  private void drawPlank(Canvas c, float w, float h) {
                      drawHead(c, w * 0.22f, h * 0.46f, dp(11));
                      c.drawLine(w * 0.28f, h * 0.46f, w * 0.72f, h * 0.54f, linePaint);
                      c.drawLine(w * 0.36f, h * 0.48f, w * 0.30f, h * 0.66f, linePaint);
                      c.drawLine(w * 0.66f, h * 0.53f, w * 0.76f, h * 0.70f, linePaint);
                  }

                  private void drawDeadlift(Canvas c, float w, float h) {
                      float x = w * 0.50f;
                      drawHead(c, x, h * 0.28f, dp(13));
                      c.drawLine(x, h * 0.34f, x, h * 0.54f, linePaint);
                      c.drawLine(x, h * 0.42f, x - dp(34), h * 0.58f, linePaint);
                      c.drawLine(x, h * 0.42f, x + dp(34), h * 0.58f, linePaint);
                      c.drawLine(x, h * 0.54f, x - dp(20), h * 0.72f, linePaint);
                      c.drawLine(x, h * 0.54f, x + dp(18), h * 0.72f, linePaint);
                      c.drawLine(w * 0.28f, h * 0.62f, w * 0.72f, h * 0.62f, linePaint);
                      c.drawCircle(w * 0.22f, h * 0.62f, dp(10), linePaint);
                      c.drawCircle(w * 0.78f, h * 0.62f, dp(10), linePaint);
                  }

                  private void drawPress(Canvas c, float w, float h) {
                      float x = w * 0.50f;
                      drawHead(c, x, h * 0.30f, dp(13));
                      c.drawLine(x, h * 0.36f, x, h * 0.60f, linePaint);
                      c.drawLine(x, h * 0.60f, x - dp(24), h * 0.76f, linePaint);
                      c.drawLine(x, h * 0.60f, x + dp(24), h * 0.76f, linePaint);
                      c.drawLine(x - dp(22), h * 0.42f, x - dp(22), h * 0.22f, linePaint);
                      c.drawLine(x + dp(22), h * 0.42f, x + dp(22), h * 0.22f, linePaint);
                      c.drawLine(x - dp(44), h * 0.22f, x + dp(44), h * 0.22f, linePaint);
                  }

                  private void drawSitup(Canvas c, float w, float h) {
                      drawHead(c, w * 0.35f, h * 0.44f, dp(11));
                      c.drawLine(w * 0.40f, h * 0.48f, w * 0.56f, h * 0.62f, linePaint);
                      c.drawLine(w * 0.56f, h * 0.62f, w * 0.72f, h * 0.62f, linePaint);
                      c.drawLine(w * 0.56f, h * 0.62f, w * 0.70f, h * 0.78f, linePaint);
                      c.drawLine(w * 0.72f, h * 0.62f, w * 0.82f, h * 0.54f, linePaint);
                  }

                  private void drawJumpingJack(Canvas c, float w, float h) {
                      float x = w * 0.50f;
                      drawHead(c, x, h * 0.24f, dp(13));
                      c.drawLine(x, h * 0.30f, x, h * 0.54f, linePaint);
                      c.drawLine(x, h * 0.38f, x - dp(48), h * 0.22f, linePaint);
                      c.drawLine(x, h * 0.38f, x + dp(48), h * 0.22f, linePaint);
                      c.drawLine(x, h * 0.54f, x - dp(42), h * 0.76f, linePaint);
                      c.drawLine(x, h * 0.54f, x + dp(42), h * 0.76f, linePaint);
                  }

                  private void drawDone(Canvas c, float w, float h) {
                      c.drawLine(w * 0.30f, h * 0.56f, w * 0.45f, h * 0.70f, linePaint);
                      c.drawLine(w * 0.45f, h * 0.70f, w * 0.72f, h * 0.36f, linePaint);
                  }

                  private void drawGeneric(Canvas c, float w, float h) {
                      float x = w * 0.50f;
                      drawHead(c, x, h * 0.24f, dp(13));
                      c.drawLine(x, h * 0.30f, x, h * 0.56f, linePaint);
                      c.drawLine(x, h * 0.40f, x - dp(34), h * 0.52f, linePaint);
                      c.drawLine(x, h * 0.40f, x + dp(34), h * 0.52f, linePaint);
                      c.drawLine(x, h * 0.56f, x - dp(26), h * 0.76f, linePaint);
                      c.drawLine(x, h * 0.56f, x + dp(26), h * 0.76f, linePaint);
                  }
              }
          }
          EOF

