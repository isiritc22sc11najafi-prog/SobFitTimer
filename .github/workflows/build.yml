                  phaseParams.topMargin = dp(18);
                  root.addView(phaseText, phaseParams);

                  timerText = makeText("00:00", 68, WHITE, true);
                  timerText.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.addView(timerText, fullWidth());

                  exerciseText = makeText(firstExercise().toUpperCase(Locale.ROOT), 25, WHITE, true);
                  exerciseText.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.addView(exerciseText, fullWidth());

                  progressText = makeText("", 16, LIGHT, false);
                  progressText.setGravity(Gravity.CENTER_HORIZONTAL);
                  LinearLayout.LayoutParams progressParams = fullWidth();
                  progressParams.topMargin = dp(4);
                  root.addView(progressText, progressParams);

                  nextText = makeText("", 14, SOFT, false);
                  nextText.setGravity(Gravity.CENTER_HORIZONTAL);
                  LinearLayout.LayoutParams nextParams = fullWidth();
                  nextParams.topMargin = dp(8);
                  nextParams.bottomMargin = dp(12);
                  root.addView(nextText, nextParams);

                  sketchView = new ExerciseSketchView(this);
                  LinearLayout.LayoutParams sketchParams =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f
                          );
                  root.addView(sketchView, sketchParams);

                  LinearLayout buttonRow = new LinearLayout(this);
                  buttonRow.setOrientation(LinearLayout.VERTICAL);

                  startPauseButton = makePrimaryButton("START");
                  buttonRow.addView(startPauseButton, fullWidth());

                  resetButton = makeSecondaryButton("RESET");
                  LinearLayout.LayoutParams resetParams = fullWidth();
                  resetParams.topMargin = dp(10);
                  buttonRow.addView(resetButton, resetParams);

                  backButton = makeDangerButton("BACK TO SETTINGS");
                  LinearLayout.LayoutParams backParams = fullWidth();
                  backParams.topMargin = dp(10);
                  buttonRow.addView(backButton, backParams);

                  LinearLayout.LayoutParams buttonRowParams = fullWidth();
                  buttonRowParams.topMargin = dp(16);
                  root.addView(buttonRow, buttonRowParams);

                  setContentView(root);

                  startPauseButton.setOnClickListener(v -> handleStartPause());
                  resetButton.setOnClickListener(v -> resetWorkout());
                  backButton.setOnClickListener(v -> finish());
              }

              private void handleStartPause() {
                  if (!started) {
                      started = true;
                      paused = false;
                      currentExercise = 0;
                      currentSet = 1;
                      currentRound = 1;
                      startReady();
                  } else if (!paused) {
                      pauseWorkout();
                  } else {
                      resumeWorkout();
                  }
              }

              private void startReady() {
                  phaseText.setText("READY");
                  phaseText.setTextColor(MINT);
                  exerciseText.setText(firstExercise().toUpperCase(Locale.ROOT));
                  sketchView.setExerciseName(firstExercise());
                  nextText.setText("شروع با: " + firstExercise());
                  updateProgress();
                  tripleWhistle();
                  runTimer(3000, this::startWork);
              }

              private void startWork() {
                  phaseText.setText("WORK");
                  phaseText.setTextColor(MINT);

                  String currentName = exerciseNames.get(currentExercise);
                  exerciseText.setText(currentName.toUpperCase(Locale.ROOT));
                  sketchView.setExerciseName(currentName);

                  String next = getNextExerciseName();
                  nextText.setText(next == null ? "آخرین بخش این راند" : "بعدی: " + next);

                  updateProgress();
                  whistle();
                  runTimer(workSeconds * 1000L, this::workFinished);
              }

              private void workFinished() {
                  whistle();

                  if (currentExercise < exerciseCount - 1) {
                      currentExercise++;
                      startExerciseRest();
                      return;
                  }

                  if (currentSet < totalSets) {
                      currentSet++;
                      currentExercise = 0;
                      startExerciseRest();
                      return;
                  }

                  if (currentRound < totalRounds) {
                      currentRound++;
                      currentSet = 1;
                      currentExercise = 0;
                      startRoundRest();
                      return;
                  }

                  finishWorkout();
              }

              private void startExerciseRest() {
                  phaseText.setText("REST");
                  phaseText.setTextColor(ORANGE);

                  String nextName = exerciseNames.get(currentExercise);
                  exerciseText.setText(("NEXT: " + nextName).toUpperCase(Locale.ROOT));
                  sketchView.setExerciseName(nextName);
                  nextText.setText("آماده شو برای: " + nextName);

                  updateProgress();
                  runTimer(restSeconds * 1000L, this::startWork);
              }

              private void startRoundRest() {
                  phaseText.setText("ROUND REST");
                  phaseText.setTextColor(ORANGE);

                  String nextName = firstExercise();
                  exerciseText.setText(("ROUND " + currentRound).toUpperCase(Locale.ROOT));
                  sketchView.setExerciseName(nextName);
                  nextText.setText("شروع راند بعدی با: " + nextName);

                  updateProgress();
                  runTimer(roundRestSeconds * 1000L, this::startWork);
              }

              private void finishWorkout() {
                  started = false;
                  paused = false;

                  if (timer != null) timer.cancel();
                  remainingMs = 0;

                  phaseText.setText("COMPLETE");
                  phaseText.setTextColor(MINT);
                  timerText.setText("00:00");
                  exerciseText.setText("GREAT JOB!");
                  nextText.setText("تمرین با موفقیت به پایان رسید");
                  sketchView.setExerciseName("done");
                  startPauseButton.setText("START");

                  tripleWhistle();
              }

              private void pauseWorkout() {
                  if (timer != null) timer.cancel();
                  paused = true;
                  phaseText.setText("PAUSED");
                  phaseText.setTextColor(RED);
                  startPauseButton.setText("RESUME");
              }

              private void resumeWorkout() {
                  paused = false;
                  runTimer(remainingMs, finishAction);
              }

              private void resetWorkout() {
                  if (timer != null) timer.cancel();
                  handler.removeCallbacksAndMessages(null);

                  started = false;
                  paused = false;
                  remainingMs = 0;
                  currentExercise = 0;
                  currentSet = 1;
                  currentRound = 1;

                  startPauseButton.setText("START");
                  showIdle();
              }

              private void showIdle() {
                  phaseText.setText("READY");
                  phaseText.setTextColor(MINT);
                  timerText.setText("00:00");
                  exerciseText.setText(firstExercise().toUpperCase(Locale.ROOT));
                  nextText.setText("برای شروع، دکمه START را بزن");
                  sketchView.setExerciseName(firstExercise());
                  updateProgress();
              }

              private void updateProgress() {
                  progressText.setText(
                          String.format(
                                  Locale.US,
                                  "EX %d/%d   SET %d/%d   ROUND %d/%d",
                                  currentExercise + 1,
                                  exerciseCount,
                                  currentSet,
                                  totalSets,
                                  currentRound,
                                  totalRounds
                          )
                  );
              }

              private void runTimer(long durationMs, Runnable whenFinished) {
                  if (timer != null) timer.cancel();

                  finishAction = whenFinished;
                  remainingMs = durationMs;

                  if (durationMs <= 0) {
                      displayTime(0);
                      if (finishAction != null) finishAction.run();
                      return;
                  }

                  timer = new CountDownTimer(durationMs, 250) {
                      @Override
                      public void onTick(long millisUntilFinished) {
                          remainingMs = millisUntilFinished;
                          long seconds = (millisUntilFinished + 999) / 1000;
                          displayTime(seconds);
                      }

                      @Override
                      public void onFinish() {
                          remainingMs = 0;
                          displayTime(0);
                          if (finishAction != null) finishAction.run();
                      }
                  };

                  timer.start();
                  startPauseButton.setText("PAUSE");
              }

              private void displayTime(long seconds) {
                  long min = seconds / 60;
                  long sec = seconds % 60;
                  timerText.setText(String.format(Locale.US, "%02d:%02d", min, sec));
              }

              private void whistle() {
                  if (soundPool != null && whistleLoaded) {
                      soundPool.play(whistleSoundId, 1f, 1f, 1, 0, 1f);
                  }
              }

              private void tripleWhistle() {
                  whistle();
                  handler.postDelayed(this::whistle, 1000);
                  handler.postDelayed(this::whistle, 2000);
              }

              private String firstExercise() {
                  return exerciseNames.get(0);
              }

              private String getNextExerciseName() {
                  if (currentExercise + 1 < exerciseCount) {
                      return exerciseNames.get(currentExercise + 1);
                  }
                  if (currentSet < totalSets) {
                      return exerciseNames.get(0);
                  }
                  if (currentRound < totalRounds) {
                      return exerciseNames.get(0);
                  }
                  return null;
              }

              private TextView makeText(String text, int size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              private Button makePrimaryButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(true);
                  b.setTextColor(BG);
                  b.setTextSize(18);
                  b.setTypeface(Typeface.DEFAULT_BOLD);
                  b.setBackgroundColor(MINT);
                  b.setPadding(dp(10), dp(14), dp(10), dp(14));
                  return b;
              }

              private Button makeSecondaryButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(true);
                  b.setTextColor(WHITE);
                  b.setTextSize(16);
                  b.setTypeface(Typeface.DEFAULT_BOLD);
                  b.setBackgroundColor(Color.rgb(28, 56, 90));
                  b.setPadding(dp(10), dp(12), dp(10), dp(12));
                  return b;
              }

              private Button makeDangerButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(true);
                  b.setTextColor(WHITE);
                  b.setTextSize(15);
                  b.setTypeface(Typeface.DEFAULT_BOLD);
                  b.setBackgroundColor(Color.rgb(92, 36, 36));
                  b.setPadding(dp(10), dp(12), dp(10), dp(12));
                  return b;
              }

              private LinearLayout.LayoutParams fullWidth() {
                  return new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                  );
              }

              private int dp(int value) {
                  float density = getResources().getDisplayMetrics().density;
                  return Math.round(value * density);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (timer != null) timer.cancel();
                  handler.removeCallbacksAndMessages(null);
                  if (soundPool != null) {
                      soundPool.release();
                      soundPool = null;
                  }
              }
          }
