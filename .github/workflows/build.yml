name: Build SobFitTimer APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/sobfittimer/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SobFitTimer"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sobfittimer.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.sobfittimer.app"
                  minSdk 21
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="SobFitTimer"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/sobfittimer/app/MainActivity.java <<'EOF'
          package com.sobfittimer.app;

          import android.app.Activity;
          import android.graphics.Color;
          import android.media.AudioManager;
          import android.media.ToneGenerator;
          import android.os.Bundle;
          import android.os.CountDownTimer;
          import android.os.Handler;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private TextView phaseText;
              private TextView timerText;
              private TextView exerciseText;
              private TextView progressText;

              private EditText workInput;
              private EditText restInput;
              private EditText setsInput;
              private EditText roundsInput;
              private EditText roundRestInput;

              private Button startPauseButton;
              private Button resetButton;

              private CountDownTimer timer;
              private long remainingMs;
              private Runnable finishAction;

              private boolean started = false;
              private boolean paused = false;

              private int workSeconds;
              private int restSeconds;
              private int totalSets;
              private int totalRounds;
              private int roundRestSeconds;

              private int currentExercise = 0;
              private int currentSet = 1;
              private int currentRound = 1;

              private final String[] exercises = {
                      "BURPEE",
                      "LIFT",
                      "PUSH PRESS"
              };

              private ToneGenerator toneGenerator;
              private final Handler handler = new Handler();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  toneGenerator = new ToneGenerator(AudioManager.STREAM_ALARM, 100);

                  buildInterface();
                  showIdle();
              }

              private void buildInterface() {

                  ScrollView scroll = new ScrollView(this);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(32, 30, 32, 40);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setBackgroundColor(Color.rgb(13, 24, 38));

                  TextView title = makeText("SobFitTimer", 30, Color.WHITE);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, fullWidth());

                  TextView subtitle = makeText(
                          "CROSSFIT INTERVAL TIMER",
                          14,
                          Color.rgb(80, 210, 150)
                  );
                  subtitle.setGravity(Gravity.CENTER);
                  root.addView(subtitle, fullWidth());

                  phaseText = makeText("READY", 24, Color.rgb(80, 210, 150));
                  phaseText.setGravity(Gravity.CENTER);
                  phaseText.setPadding(0, 35, 0, 5);
                  root.addView(phaseText, fullWidth());

                  timerText = makeText("00:00", 64, Color.WHITE);
                  timerText.setGravity(Gravity.CENTER);
                  root.addView(timerText, fullWidth());

                  exerciseText = makeText("BURPEE", 25, Color.WHITE);
                  exerciseText.setGravity(Gravity.CENTER);
                  exerciseText.setPadding(0, 10, 0, 5);
                  root.addView(exerciseText, fullWidth());

                  progressText = makeText(
                          "SET 1 / 3     ROUND 1 / 2",
                          16,
                          Color.LTGRAY
                  );
                  progressText.setGravity(Gravity.CENTER);
                  progressText.setPadding(0, 0, 0, 28);
                  root.addView(progressText, fullWidth());

                  workInput = addInput(root, "Exercise time (seconds)", "100");
                  restInput = addInput(root, "Rest between exercises (seconds)", "20");
                  setsInput = addInput(root, "Sets", "3");
                  roundsInput = addInput(root, "Rounds", "2");
                  roundRestInput = addInput(root, "Rest between rounds (seconds)", "180");

                  startPauseButton = new Button(this);
                  startPauseButton.setText("START");
                  startPauseButton.setTextSize(20);
                  startPauseButton.setAllCaps(true);

                  LinearLayout.LayoutParams buttonParams =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  150
                          );

                  buttonParams.setMargins(0, 25, 0, 10);

                  root.addView(startPauseButton, buttonParams);

                  resetButton = new Button(this);
                  resetButton.setText("RESET");
                  resetButton.setTextSize(17);

                  root.addView(resetButton, fullWidth());

                  TextView info = makeText(
                          "Exercises: BURPEE  •  LIFT  •  PUSH PRESS\n" +
                          "Three warning whistles before the workout.",
                          13,
                          Color.LTGRAY
                  );

                  info.setGravity(Gravity.CENTER);
                  info.setPadding(5, 30, 5, 20);
                  root.addView(info, fullWidth());

                  scroll.addView(root);
                  setContentView(scroll);

                  startPauseButton.setOnClickListener(v -> handleStartPause());
                  resetButton.setOnClickListener(v -> resetWorkout());
              }

              private EditText addInput(
                      LinearLayout parent,
                      String hint,
                      String value
              ) {

                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setText(value);
                  e.setTextColor(Color.WHITE);
                  e.setHintTextColor(Color.GRAY);
                  e.setSingleLine(true);
                  e.setInputType(android.text.InputType.TYPE_CLASS_NUMBER);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          );

                  p.setMargins(0, 5, 0, 5);
                  parent.addView(e, p);

                  return e;
              }

              private TextView makeText(
                      String text,
                      float size,
                      int color
              ) {

                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  return t;
              }

              private LinearLayout.LayoutParams fullWidth() {
                  return new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                  );
              }

              private void handleStartPause() {

                  if (!started) {
                      if (!readSettings()) return;

                      started = true;
                      paused = false;

                      disableInputs(true);

                      currentExercise = 0;
                      currentSet = 1;
                      currentRound = 1;

                      startReady();

                  } else if (!paused) {

                      pauseWorkout();

                  } else {

                      resumeWorkout();
                  }
              }

              private boolean readSettings() {

                  try {

                      workSeconds =
                              Integer.parseInt(workInput.getText().toString());

                      restSeconds =
                              Integer.parseInt(restInput.getText().toString());

                      totalSets =
                              Integer.parseInt(setsInput.getText().toString());

                      totalRounds =
                              Integer.parseInt(roundsInput.getText().toString());

                      roundRestSeconds =
                              Integer.parseInt(roundRestInput.getText().toString());

                      if (workSeconds < 1 ||
                              restSeconds < 0 ||
                              totalSets < 1 ||
                              totalRounds < 1 ||
                              roundRestSeconds < 0) {

                          throw new Exception();
                      }

                      return true;

                  } catch (Exception e) {

                      Toast.makeText(
                              this,
                              "Please check timer settings.",
                              Toast.LENGTH_LONG
                      ).show();

                      return false;
                  }
              }

              private void startReady() {

                  phaseText.setText("GET READY");
                  exerciseText.setText(exercises[0]);
                  updateProgress();

                  tripleWhistle();

                  runTimer(
                          3000,
                          this::startWork
                  );
              }

              private void startWork() {

                  phaseText.setText("WORK");
                  exerciseText.setText(exercises[currentExercise]);

                  updateProgress();

                  whistle();

                  runTimer(
                          workSeconds * 1000L,
                          this::workFinished
                  );
              }

              private void workFinished() {

                  whistle();

                  if (currentExercise < exercises.length - 1) {

                      currentExercise++;

                      startRest(
                              restSeconds,
                              this::startWork
                      );

                  } else if (currentSet < totalSets) {

                      currentSet++;
                      currentExercise = 0;

                      startRest(
                              restSeconds,
                              this::startWork
                      );

                  } else if (currentRound < totalRounds) {

                      currentRound++;
                      currentSet = 1;
                      currentExercise = 0;

                      startRoundRest();

                  } else {

                      finishWorkout();
                  }
              }

              private void startRest(int seconds, Runnable next) {

                  phaseText.setText("REST");
                  exerciseText.setText(
                          "NEXT: " + exercises[currentExercise]
                  );

                  updateProgress();

                  runTimer(
                          seconds * 1000L,
                          next
                  );
              }

              private void startRoundRest() {

                  phaseText.setText("ROUND REST");
                  exerciseText.setText(
                          "NEXT ROUND: " + currentRound
                  );

                  updateProgress();

                  runTimer(
                          roundRestSeconds * 1000L,
                          this::startWork
                  );
              }

              private void runTimer(
                      long duration,
                      Runnable whenFinished
              ) {

                  finishAction = whenFinished;
                  remainingMs = duration;

                  if (duration <= 0) {
                      whenFinished.run();
                      return;
                  }

                  timer = new CountDownTimer(duration, 250) {

                      @Override
                      public void onTick(long millisUntilFinished) {

                          remainingMs = millisUntilFinished;

                          long seconds =
                                  (millisUntilFinished + 999) / 1000;

                          displayTime(seconds);
                      }

                      @Override
                      public void onFinish() {

                          remainingMs = 0;
                          displayTime(0);

                          if (finishAction != null) {
                              finishAction.run();
                          }
                      }
                  };

                  timer.start();

                  startPauseButton.setText("PAUSE");
              }

              private void pauseWorkout() {

                  if (timer != null) timer.cancel();

                  paused = true;
                  startPauseButton.setText("RESUME");
                  phaseText.setText("PAUSED");
              }

              private void resumeWorkout() {

                  paused = false;

                  runTimer(
                          remainingMs,
                          finishAction
                  );
              }

              private void finishWorkout() {

                  started = false;
                  paused = false;

                  phaseText.setText("WORKOUT COMPLETE");
                  exerciseText.setText("GREAT JOB!");
                  timerText.setText("00:00");

                  startPauseButton.setText("START");

                  disableInputs(false);

                  tripleWhistle();
              }

              private void resetWorkout() {

                  if (timer != null) timer.cancel();

                  handler.removeCallbacksAndMessages(null);

                  started = false;
                  paused = false;

                  currentExercise = 0;
                  currentSet = 1;
                  currentRound = 1;

                  disableInputs(false);

                  startPauseButton.setText("START");

                  showIdle();
              }

              private void showIdle() {

                  phaseText.setText("READY");
                  timerText.setText("00:00");
                  exerciseText.setText("BURPEE");

                  progressText.setText(
                          "SET 1 / 3     ROUND 1 / 2"
                  );
              }

              private void updateProgress() {

                  progressText.setText(
                          "SET " + currentSet + " / " + totalSets +
                          "     ROUND " + currentRound + " / " + totalRounds
                  );
              }

              private void displayTime(long seconds) {

                  long min = seconds / 60;
                  long sec = seconds % 60;

                  timerText.setText(
                          String.format("%02d:%02d", min
